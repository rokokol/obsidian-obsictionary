name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run typecheck && npm run lint && npm test

      - name: Build
        run: node esbuild.config.mjs production

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag can be pushed again — after a history rewrite, say — and the release
          # is then already there. Leave it alone rather than failing the run
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it as it is"
            exit 0
          fi

          gh release create "$TAG" \
            --title="$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
