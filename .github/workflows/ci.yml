name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # check-pins.sh comes verbatim from the ci skill's templates/ and proves on every
      # run that it catches each unpinned-lookup shape it claims
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
